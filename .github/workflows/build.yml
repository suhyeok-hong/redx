name: Build redx APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          npm init -y
          npm i @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4
          mkdir -p www
          echo "<h1>redx loading...</h1>" > www/index.html

          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.redx.app",
            "appName": "redx",
            "webDir": "www",
            "server": {
              "url": "https://redx-sand.vercel.app/api?url=http://redx.dothome.co.kr/visit/",
              "cleartext": true
            }
          }
          EOF

          npx cap add android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redx-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
